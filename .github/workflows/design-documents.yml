name: ChurchOS design documents
on:
  push:
    paths:
      - '**.md'
      - '**.csv'
      - '**.json'
      - '**.docx'
      - '**.sql'
      - 'tools/validation/**'
      - 'tests/design/**'
      - '.github/workflows/design-documents.yml'
  pull_request:
    paths:
      - '**.md'
      - '**.csv'
      - '**.json'
      - '**.docx'
      - '**.sql'
      - 'tools/validation/**'
      - 'tests/design/**'
      - '.github/workflows/design-documents.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/validation/requirements-design.txt
      - run: python -m unittest discover -s tests/design -p 'test_*.py'
      - run: python tools/validation/validate_design_docs.py
      - run: python tools/validation/validate_duplicate_copies.py
