name: ChurchOS mobile foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    name: Flutter analyze and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/church-os
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --reporter expanded
