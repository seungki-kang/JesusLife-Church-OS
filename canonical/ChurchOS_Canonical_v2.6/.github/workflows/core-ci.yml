name: church-core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/church-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/church-core/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
