openapi: 3.1.0
info:
  title: Church OS Public API
  version: 1.3.0
  description: ChurchOS independent church operations API; six specialist products
    integrate through versioned APIs and own their data.
  contact:
    name: Church OS API Governance
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: https://api.example.invalid/api/v1/church
  description: Placeholder only; deployment host is not approved.
security:
- churchOidc: []
tags:
- name: Tenant
- name: Membership
- name: Community
- name: Event
- name: Attendance
- name: Care
- name: Ministry
- name: Experience
- name: Integration
- name: Brand
- name: Notice
- name: Campus
- name: Governance
paths:
  /tenants/{tenantId}:
    get:
      tags:
      - Tenant
      operationId: getTenant
      summary: Read an authorized church tenant
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          $ref: '#/components/responses/NotFound'
  /memberships:
    get:
      tags:
      - Membership
      operationId: listMemberships
      summary: List memberships within the verified tenant context
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Membership page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
    post:
      tags:
      - Membership
      operationId: createMembership
      summary: Create a church membership
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipCreate'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Created membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '409':
          $ref: '#/components/responses/Conflict'
      description: Requires current TENANT_ADMIN and Idempotency-Key. Writes, receipt
        metadata and ALLOW audit commit atomically. Replays return original 201 response;
        changed body or expired key returns 409. Creates an identity-unbound membership.
  /communities:
    get:
      tags:
      - Community
      operationId: listCommunities
      summary: List groups teams and departments
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Community page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPage'
    post:
      tags:
      - Community
      operationId: createCommunity
      summary: Create a group team or department
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityCreate'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Created community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Community'
  /events:
    get:
      tags:
      - Event
      operationId: listEvents
      summary: List authorized worship services and events
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Event page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
    post:
      tags:
      - Event
      operationId: createEvent
      summary: Create a worship service or event
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Created event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '409':
          $ref: '#/components/responses/Conflict'
      description: Requires current TENANT_ADMIN and Idempotency-Key. Writes, receipt
        metadata and ALLOW audit commit atomically. Replays return original 201 response;
        changed body or expired key returns 409. Creates DRAFT only; publication is
        not implemented.
  /attendance/check-ins:
    post:
      tags:
      - Attendance
      operationId: checkInAttendance
      summary: Record event attendance without inferring growth
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCheckIn'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Attendance record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
        '409':
          $ref: '#/components/responses/Conflict'
  /care-tasks:
    get:
      tags:
      - Care
      operationId: listCareTasks
      summary: List purpose-authorized care workflow tasks
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/TaskStatus'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Care task page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareTaskPage'
    post:
      tags:
      - Care
      operationId: createCareTask
      summary: Create a care task with minimized operational text
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareTaskCreate'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareTask'
  /ministries/assignments:
    post:
      tags:
      - Ministry
      operationId: createMinistryAssignment
      summary: Assign a voluntary ministry role
      description: Growth scores and private reflection data are prohibited assignment
        inputs.
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MinistryAssignmentCreate'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinistryAssignment'
  /today:
    get:
      tags:
      - Experience
      operationId: getMemberToday
      summary: Get the signed-in member's prioritized action feed
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Personal Today feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayFeed'
  /pastor-overview:
    get:
      tags:
      - Experience
      operationId: getPastorOverview
      summary: Get aggregate-only church operational overview
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - name: period
        in: query
        required: true
        schema:
          type: string
          pattern: ^P([1-9][0-9]*D|[1-9][0-9]*W|[1-9][0-9]*M)$
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Suppression-aware aggregate overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PastorOverview'
  /integrations:
    get:
      tags:
      - Integration
      operationId: listIntegrations
      summary: List professional-app connections without protected content
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Integration states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationConnection'
  /integrations/{provider}/handoffs:
    post:
      tags:
      - Integration
      operationId: createIntegrationHandoff
      summary: Create a short-lived one-time handoff
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - name: provider
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Provider'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: One-time handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Handoff'
  /integrations/{provider}/return-uris:
    get:
      tags:
      - Integration
      operationId: listRegisteredReturnUris
      summary: List tenant and provider return URI registrations
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - name: provider
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Provider'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Registered return URIs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReturnUriRegistration'
    post:
      tags:
      - Integration
      operationId: registerReturnUri
      summary: Register an administrator-approved HTTPS return URI
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - name: provider
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Provider'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnUriRegistrationCreate'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Registered return URI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnUriRegistration'
        '409':
          $ref: '#/components/responses/Conflict'
  /brand-config:
    get:
      tags:
      - Brand
      operationId: getBrandConfig
      summary: Read bounded white-label configuration
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Brand configuration
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandConfig'
    put:
      tags:
      - Brand
      operationId: replaceBrandConfig
      summary: Replace bounded white-label configuration
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandConfigReplace'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Updated configuration
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandConfig'
        '412':
          description: Version conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /care-tasks/{taskId}/status:
    patch:
      tags:
      - Care
      operationId: changeCareTaskStatus
      summary: Assign progress complete or cancel a care task
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareTaskStatusChange'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareTask'
        '409':
          $ref: '#/components/responses/Conflict'
  /ministries/assignments/{assignmentId}/decision:
    patch:
      tags:
      - Ministry
      operationId: decideMinistryAssignment
      summary: Accept or decline a proposed ministry assignment
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AssignmentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MinistryDecision'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinistryAssignment'
        '409':
          $ref: '#/components/responses/Conflict'
  /events/{eventId}:
    patch:
      operationId: updateEvent
      tags:
      - Event
      summary: updateEvent
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/LifecycleIfMatch'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: Authorized current resource revision
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
      description: TENANT_ADMIN only. Atomic mutation, successful audit and receipt.
        Same key retries replay only while resulting resource revision remains current;
        later revisions cause 409 REPLAY_SUPERSEDED without content snapshots. Cancelled
        resources cannot be edited or republished. COMPLETED/EXPIRED transitions are
        reserved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
    get:
      operationId: getEvent
      tags:
      - Event
      summary: getEvent
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/EventId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: Authorized current resource revision
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
  /notices:
    get:
      tags:
      - Notice
      operationId: listNotices
      summary: List published church notices
      parameters:
      - $ref: '#/components/parameters/PurposeCode'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Notice page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticePage'
    post:
      tags:
      - Notice
      operationId: createNotice
      summary: Create a bounded church notice
      parameters:
