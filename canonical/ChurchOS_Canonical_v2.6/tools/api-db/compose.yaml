services:
  database:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: disposable-integration-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  verify:
    build:
      context: ../..
      dockerfile: tools/api-db/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable-integration-only
      PGDATABASE: postgres
      COS_DISPOSABLE_CLUSTER: '1'
      API_DB_EVIDENCE: /evidence/api-db-result.json
    volumes:
      - ../../../ChurchOS_API_DB_Evidence_v2.6:/evidence
