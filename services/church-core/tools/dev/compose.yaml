# Local development stack with SYNTHETIC identity (S02/S03). Not for production.
# From services/church-core:
#   docker compose -f tools/dev/compose.yaml up --build -d
#   docker compose -f tools/dev/compose.yaml run --rm setup node dist/tools/synthetic-identity/cli.js token synthetic-member --dir /keys
# API: http://127.0.0.1:3000 (loopback only). Reset data: add --reset to the setup command or remove the volumes.
name: churchos-dev
x-dev-db: &dev-db
  DEV_DB_PASSWORD: dev-only-not-a-secret
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev-only-admin
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
  setup:
    build:
      context: ../..
      dockerfile: tools/dev/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *dev-db
      CHURCHOS_DEV_SETUP: '1'
      PGHOST: database
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: dev-only-admin
    volumes:
      - dev-keys:/keys
    command:
      [
        'sh',
        '-c',
        'node dist/tools/synthetic-identity/cli.js init --dir /keys && node dist/tools/dev/setup.js > /dev/null',
      ]
  api:
    build:
      context: ../..
      dockerfile: tools/dev/Dockerfile
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://churchos_dev_app:dev-only-not-a-secret@database:5432/churchos_dev
      IDENTITY_MODE: synthetic
      OIDC_AUDIENCE: churchos-api
      SYNTHETIC_JWKS_FILE: /keys/jwks.json
      HOST: 0.0.0.0
      PORT: '3000'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - dev-keys:/keys:ro
    command: ['node', 'dist/src/main.js']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dev-db:
  dev-keys:
